<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery</title>
  <link rel="stylesheet" href="../../static/css/misc.css"><link rel="stylesheet" href="./gallery.css">
</head>
<body>
  <a class="back-link" href="../bio/">返回</a>
  <main class="gallery-shell">
    <header class="gallery-header"><h1>Gallery</h1><div class="category-key" id="categoryKey" aria-label="分类图例"></div></header>
    <section class="masonry" id="gallery" aria-label="活动记录"></section>
    <p class="empty-state" id="emptyState" hidden>还没有活动记录。</p>
  </main>
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-backdrop" type="button" data-close aria-label="关闭详情"></button>
    <article class="detail" role="dialog" aria-modal="true" aria-labelledby="detailTitle">
      <button class="detail-close" type="button" data-close aria-label="关闭">×</button>
      <div class="detail-media"><img id="detailImage" alt=""></div>
      <div class="detail-copy"><p class="detail-category" id="detailCategory"></p><h2 id="detailTitle"></h2><time id="detailDate"></time><div class="detail-body" id="detailBody"></div></div>
    </article>
  </div>
  <script src="./gallery-data.js"></script><script src="./gallery.js"></script>
</body>
</html>
